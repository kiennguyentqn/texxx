<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Links</title>
    <style>
      :root {
        --bg: #0f0e12;
        --card: #17161b;
        --border: #26252b;
        --cyan: #22e5e5;
        --white: #f2f2f4;
        --dim: #6f6e76;
        --orange: #ff8a1f;
        --red: #ff3b4e;
        --purple: #a06bff;
        --btn: #26252b;
        --g1: #ff2d55;
        --g2: #ff7a00;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      /* thanh nhập device ID */
      #bar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      }
      #bar form {
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
      }
      #device {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 14px;
        color: var(--white);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
        outline: none;
      }
      #device::placeholder {
        color: var(--dim);
      }
      #device:focus {
        border-color: var(--cyan);
      }
      #minratio {
        flex: none;
        width: 96px;
        font: inherit;
        font-size: 14px;
        color: var(--white);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        outline: none;
      }
      #minratio::placeholder {
        color: var(--dim);
      }
      #minratio:focus {
        border-color: var(--cyan);
      }

      /* thời gian còn lại của key */
      #auth {
        max-width: 640px;
        margin: 8px auto 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--dim);
      }
      #remain {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #4ade80;
      }
      #remain.warn {
        color: var(--orange); /* dưới 10 phút */
      }
      #remain.bad {
        color: var(--red); /* hết hạn / chưa kích hoạt */
      }

      #tabs {
        max-width: 640px;
        margin: 10px auto 0;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      #tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--dim);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.active {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(90deg, var(--g1), var(--g2));
      }
      #save {
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        cursor: pointer;
        background: linear-gradient(90deg, var(--g1), var(--g2));
      }
      #save:active {
        transform: scale(0.97);
      }

      #list {
        max-width: 640px;
        margin: 0 auto;
        padding: 12px 14px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card {
        display: flex;
        align-items: stretch;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      .bar {
        width: 4px;
        margin: 2px 0;
        background: var(--cyan);
        border-radius: 0 4px 4px 0;
        flex: none;
      }
      .body {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px;
      }

      .when {
        flex: none;
        width: 74px;
      }
      .when .t {
        font-size: 16px;
        font-weight: 700;
      }
      .when .d {
        margin-top: 2px;
        font-size: 14px;
        color: var(--dim);
      }

      .mid {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }
      .id {
        font-size: 17px;
        font-weight: 600;
        color: var(--cyan);
        white-space: nowrap;
      }
      .id b {
        color: var(--white);
        font-weight: 700;
      }

      .chip {
        font-size: 12px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid;
        white-space: nowrap;
      }
      .box {
        color: var(--orange);
        border-color: rgb(255 138 31 / 0.45);
        background: rgb(255 138 31 / 0.12);
      }
      .ratio {
        color: var(--red);
        border-color: rgb(255 59 78 / 0.45);
        background: rgb(255 59 78 / 0.12);
      }
      .live {
        color: var(--purple);
        border-color: rgb(160 107 255 / 0.45);
        background: rgb(160 107 255 / 0.12);
      }
      .time {
        color: #4ade80;
        border-color: rgb(74 222 128 / 0.45);
        background: rgb(74 222 128 / 0.12);
      }

      .actions {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button.copy,
      a.open {
        font: inherit;
        border: 0;
        cursor: pointer;
        color: #fff;
        text-decoration: none;
      }
      .copy {
        background: var(--btn);
        color: var(--white);
        font-size: 14px;
        font-weight: 600;
        padding: 12px 14px;
        border-radius: 12px;
      }
      .open {
        background: linear-gradient(90deg, var(--g1), var(--g2));
        font-size: 16px;
        font-weight: 800;
        padding: 14px 22px;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgb(255 60 60 / 0.35);
        white-space: nowrap;
      }
      .copy:active,
      .open:active {
        transform: scale(0.97);
      }
      :is(button, a, input):focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      #status {
        text-align: center;
        color: var(--dim);
        padding: 40px 20px;
      }
      #status.err {
        color: var(--red);
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #2c2b32;
        color: var(--white);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #toast.show {
        opacity: 1;
      }

      @media (max-width: 460px) {
        .body {
          gap: 8px;
          padding: 12px;
        }
        .open {
          padding: 12px 16px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <form id="form" autocomplete="off">
        <input
          id="device"
          type="text"
          placeholder="Nhập device ID (device_xxxxxxxx-...)"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
        />
        <input
          id="minratio"
          type="text"
          inputmode="decimal"
          placeholder="Ratio ≥"
          aria-label="Ratio tối thiểu"
        />
        <button id="save" type="submit">Lưu</button>
      </form>
      <div id="auth" hidden>
        <span id="authInfo"></span>
        <span id="remain"></span>
      </div>
      <div id="tabs" role="tablist"></div>
    </div>
    <div id="list"></div>
    <div id="status"></div>
    <div id="toast"></div>

    <script>
      const API_BASE = "http://vohoainam.net/api/client/links";
      const AUTH_URL = "http://vohoainam.net/api/check-auth";
      const AUTH_REFRESH_MS = 30000; // hỏi lại server mỗi 30 giây
      const STORAGE_KEY = "device_id";
      const RATIO_KEY = "min_ratio";
      const TAB_KEY = "active_tab";
      // group (chat_id Telegram) -> tên hiển thị; thứ tự này cũng là thứ tự các tab
      const CHANNELS = [
        { id: "-1002889993912", name: "Rương lớn" },
        { id: "-1003606511380", name: "Rương nhỏ" },
        { id: "-1003874158853", name: "Rương treo" },
        { id: "-1003393920142", name: "Rương test" },
        { id: "-1002601067327", name: "Túi" },
        { id: "-1003337128065", name: "Túi 0xu" },
      ];
      const CHANNEL_NAME = Object.fromEntries(
        CHANNELS.map((c) => [c.id, c.name]),
      );
      const REFRESH_MS = 2000; // gọi API mỗi 2 giây
      const MAX_ITEMS = 30; // chỉ giữ 30 link mới nhất

      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const toastEl = document.getElementById("toast");
      const inputEl = document.getElementById("device");
      const formEl = document.getElementById("form");
      const ratioEl = document.getElementById("minratio");
      const tabsEl = document.getElementById("tabs");
      const authEl = document.getElementById("auth");
      const authInfoEl = document.getElementById("authInfo");
      const remainEl = document.getElementById("remain");

      // ---------- localStorage ----------
      function readDeviceId() {
        try {
          return (localStorage.getItem(STORAGE_KEY) || "").trim();
        } catch (e) {
          return "";
        }
      }
      function writeDeviceId(v) {
        try {
          localStorage.setItem(STORAGE_KEY, v);
          return true;
        } catch (e) {
          return false;
        }
      }

      function readMinRatio() {
        try {
          const v = parseFloat(localStorage.getItem(RATIO_KEY));
          return Number.isFinite(v) ? v : null;
        } catch (e) {
          return null;
        }
      }
      function writeMinRatio(v) {
        try {
          if (v == null) localStorage.removeItem(RATIO_KEY);
          else localStorage.setItem(RATIO_KEY, String(v));
        } catch (e) {}
      }

      let deviceId = readDeviceId();
      function readTab() {
        try {
          const v = localStorage.getItem(TAB_KEY);
          return v && (v === "all" || CHANNEL_NAME[v]) ? v : "all";
        } catch (e) {
          return "all";
        }
      }
      function writeTab(v) {
        try {
          localStorage.setItem(TAB_KEY, v);
        } catch (e) {}
      }

      let minRatio = readMinRatio(); // null = không lọc
      let activeTab = readTab(); // "all" hoặc chat_id của một kênh
      let lastCounts = null; // số link của từng tab (sau khi lọc ratio)
      let lastItems = []; // dữ liệu lần gọi gần nhất, để lọc lại ngay khi bấm Lưu
      let gen = 0; // tăng mỗi lần đổi device ID để bỏ kết quả của request cũ
      let auth = null; // { authorized, expiresAt, offset, duration, keyTail }

      // ---------- helpers ----------
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
          } catch (_) {}
          ta.remove();
        }
        toast("Đã copy");
      }

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function showStatus(msg, isErr) {
        statusEl.hidden = false;
        statusEl.className = isErr ? "err" : "";
        statusEl.textContent = msg;
      }

      // ---------- data ----------
      // created_at "15:42:10 13/10/26" + time "01:30s - 15:43:40" -> mốc hết hạn (ms), hoặc null nếu không có
      // Giờ trong API được hiểu theo múi giờ của trình duyệt.
      function endTimestamp(createdStr, span) {
        const c = (createdStr || "").match(
          /^(\d+):(\d+):(\d+) (\d+)\/(\d+)\/(\d+)$/,
        );
        const e = (span || "").match(/-\s*(\d+):(\d+):(\d+)\s*$/);
        if (!c || !e) return null;
        const [ch, cm, cs, dd, mo, yy] = c.slice(1).map(Number);
        const [eh, em, es] = e.slice(1).map(Number);
        const createdAt = new Date(2000 + yy, mo - 1, dd, ch, cm, cs).getTime();
        let endAt = new Date(2000 + yy, mo - 1, dd, eh, em, es).getTime();
        if (endAt - createdAt < -12 * 3600 * 1000) endAt += 24 * 3600 * 1000; // qua nửa đêm
        return endAt;
      }

      function parse(json) {
        return Object.entries(json.links || {})
          .map(([key, o]) => {
            const m = key.match(/link(\d+)$/);
            const created = o.created_at || "";
            const sp = created.indexOf(" ");
            return {
              key,
              number: m ? Number(m[1]) : 0,
              url: o.url || "",
              group: String(o.group || ""),
              time: sp > -1 ? created.slice(0, sp) : created,
              date: sp > -1 ? created.slice(sp + 1) : "",
              box: o.box_bag || "",
              ratio: o.ratio || "",
              live: o.live || null,
              room: ((o.url || "").match(/room_id=(\d+)/) || [])[1] || "",
              span: o.time || null, // "01:30s - 15:43:40"
              endAt: endTimestamp(created, o.time),
              ratioNum: parseFloat(o.ratio), // "2.5 xu" -> 2.5
            };
          })
          .sort((a, b) => b.number - a.number); // mới nhất lên đầu
      }

      // ---------- UI ----------
      function card(it) {
        const c = el("div", "card");
        c.appendChild(el("div", "bar"));
        const body = el("div", "body");

        const mid = el("div", "mid");
        const id = el("div", "id");
        id.textContent = CHANNEL_NAME[it.group] || "Rương";
        mid.append(id, el("span", "chip box", "Box: " + it.box));
        if (it.span)
          mid.appendChild(el("span", "chip time", "Time: " + it.span));

        const actions = el("div", "actions");
        const open = el("a", "open", "Mở Link");
        // https://www.tiktok.com/share/live/<room_id>; thiếu room_id thì dùng deeplink gốc
        open.href = it.room
          ? "https://www.tiktok.com/share/live/" + it.room
          : it.url;
        open.target = "_blank";
        open.rel = "noopener";
        actions.append(open);

        body.append(mid, actions);
        c.appendChild(body);
        return c;
      }

      // ---------- tabs ----------
      const tabBtns = new Map(); // id -> { btn, name }

      function buildTabs() {
        const defs = [{ id: "all", name: "Tất cả" }, ...CHANNELS];
        for (const d of defs) {
          const b = el("button", "tab", d.name);
          b.type = "button";
          b.setAttribute("role", "tab");
          b.addEventListener("click", () => {
            activeTab = d.id;
            writeTab(d.id);
            syncTabs();
            render(lastItems);
          });
          tabBtns.set(d.id, { btn: b, name: d.name });
          tabsEl.appendChild(b);
        }
        syncTabs();
      }

      function syncTabs() {
        for (const [id, t] of tabBtns) {
          const n = lastCounts ? lastCounts[id] || 0 : null;
          t.btn.textContent = n == null ? t.name : t.name + " (" + n + ")";
          t.btn.classList.toggle("active", id === activeTab);
          t.btn.setAttribute("aria-selected", String(id === activeTab));
        }
      }

      // key -> { node, sig }: chỉ thêm/xóa/đổi thẻ nào thật sự thay đổi
      const cards = new Map();

      function clearCards() {
        cards.clear();
        listEl.replaceChildren();
      }

      function render(items) {
        const now = Date.now();
        const alive = items.filter((i) => i.endAt == null || i.endAt > now); // bỏ link đã hết giờ
        const byRatio =
          minRatio == null
            ? alive
            : alive.filter((i) => i.ratioNum >= minRatio);

        const counts = { all: byRatio.length };
        for (const it of byRatio)
          counts[it.group] = (counts[it.group] || 0) + 1;
        lastCounts = counts;
        syncTabs();

        const filtered =
          activeTab === "all"
            ? byRatio
            : byRatio.filter((i) => i.group === activeTab);
        const top = filtered.slice(0, MAX_ITEMS);
        const keep = new Set(top.map((i) => i.key));

        for (const [k, c] of cards) {
          if (!keep.has(k)) {
            c.node.remove();
            cards.delete(k);
          }
        }

        let prev = null;
        for (const it of top) {
          const sig = JSON.stringify([
            it.url,
            it.group,
            it.box,
            it.ratio,
            it.live,
            it.span,
          ]);
          let c = cards.get(it.key);
          if (!c || c.sig !== sig) {
            const node = card(it);
            if (c) c.node.replaceWith(node);
            c = { node, sig };
            cards.set(it.key, c);
          }
          const expected = prev ? prev.nextSibling : listEl.firstChild;
          if (c.node !== expected) listEl.insertBefore(c.node, expected);
          prev = c.node;
        }

        if (top.length) statusEl.hidden = true;
        else
          showStatus(
            minRatio == null
              ? "Chưa có link nào."
              : "Không có link nào có Ratio ≥ " + minRatio + ".",
            false,
          );
      }

      // ---------- auth / thời gian còn lại ----------
      function fmtRemain(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        const x = s % 60;
        const p = (n) => String(n).padStart(2, "0");
        return (
          (d > 0 ? d + " ngày " : "") +
          (d > 0 || h > 0 ? p(h) + ":" : "") +
          p(m) +
          ":" +
          p(x)
        );
      }

      function renderAuth() {
        if (!deviceId) {
          authEl.hidden = true;
          return;
        }
        authEl.hidden = false;
        if (!auth) {
          authInfoEl.textContent = "";
          remainEl.className = "";
          remainEl.textContent = "...";
          return;
        }
        authInfoEl.textContent = auth.authorized
          ? "Key …" +
            auth.keyTail +
            (auth.duration ? " · " + auth.duration : "")
          : "";
        if (!auth.authorized || auth.expiresAt == null) {
          remainEl.className = "bad";
          remainEl.textContent = "Chưa kích hoạt";
          return;
        }
        // dùng server_time để không bị lệch đồng hồ máy
        const left = auth.expiresAt - (Date.now() + auth.offset);
        if (left <= 0) {
          remainEl.className = "bad";
          remainEl.textContent = "Đã hết hạn";
        } else {
          remainEl.className = left < 10 * 60 * 1000 ? "warn" : "";
          remainEl.textContent = "Còn " + fmtRemain(left);
        }
      }

      async function loadAuth() {
        if (!deviceId) return;
        const myGen = gen;
        try {
          const res = await fetch(
            AUTH_URL + "?device_id=" + encodeURIComponent(deviceId),
            { cache: "no-store" },
          );
          const j = await res.json();
          if (myGen !== gen) return;
          const exp = Date.parse(j.expires_at);
          const srv = Date.parse(j.server_time);
          auth = {
            authorized: j.authorized === true && Number.isFinite(exp),
            expiresAt: Number.isFinite(exp) ? exp : null,
            offset: Number.isFinite(srv) ? srv - Date.now() : 0,
            duration: j.duration || "",
            keyTail: j.key_tail || "",
          };
          renderAuth();
          load(); // có kết quả kích hoạt là tải link ngay, không chờ vòng 2 giây
        } catch (e) {
          /* lỗi mạng: giữ nguyên số liệu cũ, đồng hồ vẫn tiếp tục đếm */
        }
      }

      // ---------- chặn khi chưa kích hoạt ----------
      function isActive() {
        if (!auth || !auth.authorized || auth.expiresAt == null) return false;
        return auth.expiresAt - (Date.now() + auth.offset) > 0;
      }

      function blockLinks() {
        lastItems = [];
        lastCounts = null;
        syncTabs();
        clearCards();
        showStatus(
          auth
            ? "Thiết bị chưa kích hoạt hoặc key đã hết hạn."
            : "Đang kiểm tra kích hoạt...",
          !!auth,
        );
      }

      // ---------- polling ----------
      let loading = false;
      async function load() {
        if (!deviceId) {
          showStatus("Nhập device ID ở trên rồi bấm Lưu để bắt đầu.", false);
          return;
        }
        if (!isActive()) {
          // chưa kích hoạt / hết hạn / chưa kiểm tra xong -> KHÔNG gọi API links
          blockLinks();
          return;
        }
        if (loading) return; // request trước chưa xong thì bỏ lượt này
        loading = true;
        const myGen = gen;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        try {
          const url = API_BASE + "?device_id=" + encodeURIComponent(deviceId);
          const res = await fetch(url, {
            cache: "no-store",
            signal: ctrl.signal,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();
          if (myGen !== gen) return; // device ID đã đổi trong lúc chờ
          if (json.success === false)
            throw new Error("API trả về success: false");
          lastItems = parse(json);
          render(lastItems);
        } catch (e) {
          if (myGen === gen && !cards.size)
            showStatus("Không tải được dữ liệu: " + e.message, true);
        } finally {
          clearTimeout(timer);
          loading = false;
        }
      }

      formEl.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const v = inputEl.value.trim();
        if (!v) {
          toast("Chưa nhập device ID");
          return;
        }
        const raw = ratioEl.value.trim();
        const r = raw === "" ? null : parseFloat(raw.replace(",", "."));
        if (r !== null && !Number.isFinite(r)) {
          toast("Ratio không hợp lệ");
          return;
        }

        const idChanged = v !== deviceId;
        deviceId = v;
        minRatio = r;
        const ok = writeDeviceId(v);
        writeMinRatio(r);
        toast(ok ? "Đã lưu" : "Không lưu được vào trình duyệt");

        if (idChanged) {
          gen++;
          lastItems = [];
          lastCounts = null;
          auth = null; // chưa xác nhận kích hoạt -> chưa được gọi API links
          syncTabs();
          clearCards();
          showStatus("Đang kiểm tra kích hoạt...", false);
          loading = false;
        } else {
          render(lastItems); // lọc lại ngay bằng dữ liệu đang có
        }
        renderAuth();
        load();
        loadAuth();
      });

      buildTabs();
      inputEl.value = deviceId;
      ratioEl.value = minRatio == null ? "" : String(minRatio);
      load();
      loadAuth();
      renderAuth();
      setInterval(load, REFRESH_MS);
      setInterval(loadAuth, AUTH_REFRESH_MS);
      // mỗi giây: đếm ngược thời gian key + link hết giờ biến mất ngay + chặn khi key hết hạn
      setInterval(() => {
        renderAuth();
        if (!deviceId) return;
        if (isActive()) {
          if (lastItems.length) render(lastItems);
        } else if (lastItems.length || cards.size) {
          blockLinks();
        }
      }, 1000);
    </script>
  </body>
</html>
